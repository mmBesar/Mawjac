name: Release

# Publishes a release from the build that already ran for the tagged commit.
# Nothing is rebuilt when that build has every file: the APK was signed in
# that build, and the Linux bundles were packaged there, so tagging takes
# seconds. When a file is missing (a Linux job failed, an artifact expired),
# the release starts a new Build on the tag, waits for it, and publishes from
# that instead of releasing an incomplete set.
#
#   git tag -a v0.6.2 -m "Mawjac 0.6.2" && git push origin v0.6.2
#
# The tagged commit must be one the Build workflow finished successfully on
# (a push to main). Artifacts are kept for the repository's retention period
# (90 days by default); after that, run Build again first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.6.2)"
        required: true
      run_id:
        description: "Build run to take the files from (optional; default: the successful run for the tag's commit)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Find the build for this commit
        id: build
        env:
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          sha="$(git rev-list -n1 "$TAG")"
          run_id="$INPUT_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list --workflow build.yml --commit "$sha" \
              --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi
          if [[ -z "$run_id" ]]; then
            echo "::warning::No successful Build run for commit $sha; the next step builds it."
          else
            echo "Using Build run $run_id for $TAG ($sha)"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download and check the build files
        env:
          RUN_ID: ${{ steps.build.outputs.run_id }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          # A tag may carry a suffix (v0.2.0-beta1); the files are named after
          # the version in pubspec.yaml, without it.
          version="${TAG#v}"
          version="${version%%-*}"
          arm=()
          if [[ "$PRIVATE" == "true" ]]; then
            arm=(--no-arm64)
          fi

          collect() {
            rm -rf release release-raw
            mkdir release
            gh run download "$1" --dir release-raw || true
            if [[ -d release-raw ]]; then
              find release-raw -type f -exec mv -t release {} +
            fi
            ls -l release
          }

          if [[ -n "$RUN_ID" ]]; then
            collect "$RUN_ID"
            if tool/check_release_files.sh release "$version" "${arm[@]}"; then
              exit 0
            fi
            echo "::warning::Build run $RUN_ID is missing files; building $TAG again."
          fi
          before="$(gh run list --workflow build.yml --event workflow_dispatch \
            --branch "$TAG" --limit 1 --json databaseId \
            --jq '.[0].databaseId // 0')"
          gh workflow run build.yml --ref "$TAG"
          new=""
          for _ in $(seq 1 30); do
            sleep 10
            latest="$(gh run list --workflow build.yml \
              --event workflow_dispatch --branch "$TAG" --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$latest" -gt "$before" ]]; then
              new="$latest"
              break
            fi
          done
          if [[ -z "$new" ]]; then
            echo "::error::Could not start a new Build for $TAG."
            exit 1
          fi
          echo "Waiting for Build run $new"
          gh run watch "$new" --interval 30 --exit-status || true

          # The jobs of a Build do not depend on each other, so the files can
          # exist even when the tests or the analysis failed. Never release
          # from a Build that is not green.
          conclusion="$(gh run view "$new" --json conclusion --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Build run $new ended as '$conclusion'. Nothing was released."
            exit 1
          fi

          collect "$new"
          if ! tool/check_release_files.sh release "$version" "${arm[@]}"; then
            echo "::error::The new build is still incomplete. Nothing was released; look at the failed jobs of run $new."
            exit 1
          fi

      - name: Refuse a debug-signed APK
        run: |
          apk="$(ls release/Mawjac-*-arm64-v8a.apk)"
          if keytool -printcert -jarfile "$apk" | grep -q "Android Debug"; then
            echo "::error::The APK is signed with the debug key. Check the signing secrets and build again."
            exit 1
          fi

      - name: Write checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        run: |
          set -euo pipefail
          # A plain tag such as v0.6.3 becomes the "latest" release. Only a tag
          # with a suffix (v0.2.0-beta1, v0.2.0-rc1) is marked as a pre-release.
          flag=(--latest)
          if [[ "$TAG" == *-* ]]; then
            flag=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --title "$TAG" --generate-notes --verify-tag "${flag[@]}"
